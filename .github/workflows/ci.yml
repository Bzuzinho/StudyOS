name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ink-math-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ink-recognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check ONNX runtime browser loader assets
        run: |
          test -n "$(find node_modules/onnxruntime-web/dist -maxdepth 1 -name 'ort-wasm*.mjs' -print -quit)"
          test -n "$(find node_modules/onnxruntime-web/dist -maxdepth 1 -name '*.wasm' -print -quit)"
      - name: Check bundled recognition and ONNX model availability
        run: |
          test -s dist/ink-math.js
          for file in encoder_int8.onnx decoder_int8.onnx vocab.json; do
            curl --fail --location --retry 3 --silent --show-error "https://github.com/kimseungdae/ink-on/releases/download/v0.1.0/$file" -o "/tmp/$file"
            test -s "/tmp/$file"
          done
  moodle-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moodle-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/moodle-browser/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check server.mjs && npm test
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, intl, zip
          coverage: none
      - name: Prepare Laravel writable directories
        run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      - name: Validate composer
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Unit tests
        run: vendor/bin/phpunit tests/Unit

  learning-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated browser database
        run: |
          cp .env.example .env
          touch /tmp/studyos-browser.sqlite
          php artisan key:generate
          php artisan migrate --force
          php tests/Browser/seed.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/studyos-browser.sqlite
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/studyos-browser playwright --no-audit --no-fund
          /tmp/studyos-browser/node_modules/.bin/playwright install --with-deps chromium msedge
      - name: Validate desktop, mobile and Microsoft Edge learning flows
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/studyos-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/practice > /dev/null && break || sleep 1; done
          node tests/Browser/learning.mjs
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/studyos-browser.sqlite
          STUDYOS_AI_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-browser-evidence
          path: |
            browser-evidence/
            /tmp/studyos-server.log
